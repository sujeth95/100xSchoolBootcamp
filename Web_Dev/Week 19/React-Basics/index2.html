<html>

<head>
    <script src="https://cdn.jsdelivr.net/npm/axios@1.18.1/dist/axios.min.js"></script>
    <style>
        .pretty{
            background-color: red;
            padding: 20;
            font-size: 30;
            margin: 20;
        }
    </style>
</head>

<body>
    <div id="todos">

    </div>
</body>

<script>
    axios.get("https://jsonplaceholder.typicode.com/todos")
        .then(response => {
            response.data.forEach(todo => {
                const divNode = document.createElement("div");
                divNode.innerHTML = todo.title;
                divNode.setAttribute("class", "pretty");
                document.getElementById("todos").appendChild(divNode);
            })
        })
</script>

</html>
