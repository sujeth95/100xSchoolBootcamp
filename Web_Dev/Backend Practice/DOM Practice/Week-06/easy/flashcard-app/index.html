<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FlashCard Learning App</title>
    <link rel="stylesheet" href="css/style.css" />
</head>

<body>
    <!-- Main Application Container -->
    <div id="appContainer">
        <!-- Setup screen  -->
        <div id="setupScreen">
            <h1>FlashCard Learning App</h1>

            <!-- Topic Selection -->
            <label for="topic-select">Choose your topic:</label>
            <select id="topic-select">
                <option value="JavaScript Basics">JavaScript Basics</option>
                <option value="Geography">Geography</option>
                <option value="Maths">Maths</option>
            </select>

            <br />

            <!-- Question Count Input -->
             <label for="question-count">Number of Questions:</label>
             <input id="question-count" type="number" min="1" max="5" value="3" >
            
             <br />

             <!-- Start Button -->
              <button id="start-btn">Start Quiz</button>
        </div>
    </div>

    <!-- 2. Active quiz screen (Hidden initially) -->
     <div id="quiz-screen" class="hidden">

        <div id="quiz-header">
            <span id="progress-text">Question 1 of X</span>
            <span id="score-text">Score: 0</span>
        </div>

        <!-- The FlashCard -->
         <div id="flashcard">
            <h2 id="question-text">Question goes here...</h2>

            <!-- Container for our dynamically generated buttons -->
             <div id="answer-options">
                <!-- Buttons will be inject here by JavaScript -->
             </div>
         </div>
        
     </div>

    <script src="js/data.js"></script>
    <script src="js/app.js"></script>
</body>

</html>
