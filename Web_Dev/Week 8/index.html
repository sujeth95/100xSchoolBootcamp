<html>

<head>
    <script>
        const add = async() => {
            const a = document.getElementById("first").value;
            const b = document.getElementById("second").value;

            if(a == "" || b == ""){
                // document.getElementById('response').innerHTML = "Please enter both numbers";
                alert("Please enter both numbers");
                return;
            }
            
            try {
            const res =  await fetch("http://localhost:3000/sum/" + a + "/" + b);
            const json = await res.json();
            document.getElementById("response").innerHTML = json.ans;
            } catch(e){
                document.getElementById("response").innerHTML = e;
            }
        }
    </script>
</head>

<body>
    <input id="first" type="text" placeholder="first number">
    <input id="second" type="text" placeholder="second number">

    <button onclick="add()">Add</button>
    <button>Subtract</button>
    <button>Divide</button>
    <button>Multiply</button>

    <div id="response">
        
    </div>
</body>

</html>
